<title>Arrow Escape</title>
<script>
  // Supabase sends the password-reset email link to this page (the "Site URL").
  // If the link carries reset data, forward it to the reset page.
  (function () {
    var h = location.hash || '';
    if (h.indexOf('type=recovery') > -1 || h.indexOf('error=') > -1 || h.indexOf('access_token=') > -1) {
      location.replace('reset.html' + h);
    }
  })();
</script>
<style>
  :root{--ink:#0f1535;--mid:#4a5278;--bg:#ffffff;--soft:#f1f3fb}

  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  .w{max-width:420px}
  svg{width:84px;height:84px;fill:currentColor}
  h1{margin:10px 0 6px;font-size:34px}
  p{color:var(--mid);line-height:1.6;margin:8px 0}
  a{display:inline-block;margin:6px 4px;padding:12px 18px;border-radius:14px;background:var(--soft);color:var(--ink);font-weight:700;text-decoration:none}
</style>
</head>
